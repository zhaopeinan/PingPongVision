<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台 · PingPong AI Analyst</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/workbench.css?v=6">
</head>
<body>
  <div class="wb">
    <header class="wb__header">
      <div class="wb__brand">
        <div class="wb__logo"></div>
        <div>
          <div class="wb__title">PingPong AI Analyst</div>
          <div class="wb__subtitle">工作台 · Dashboard</div>
        </div>
      </div>
      <nav class="wb__nav">
        <a href="/" class="wb__nav-link wb__nav-link--active">工作台</a>
        <a href="/analyze" class="wb__nav-link">分析</a>
      </nav>
      <div class="wb__header-right">
        <div class="wb__device-pill" id="devicePill">
          <span class="wb__dot wb__dot--idle"></span>
          <span id="deviceText">检测中...</span>
        </div>
        <span class="wb__device-metrics" id="deviceMetrics" hidden></span>
        <div class="wb__user-pill" id="userPill" hidden>
          <span id="userName">-</span>
          <button class="wb__logout-btn" id="logoutBtn" title="登出">退出</button>
        </div>
      </div>
    </header>

    <main class="wb__main">
      <!-- 统计卡片 -->
      <section class="wb__stats">
        <div class="wb__stat-card">
          <div class="wb__stat-icon wb__stat-icon--orange">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </div>
          <div class="wb__stat-body">
            <div class="wb__stat-value" id="statVideos">0</div>
            <div class="wb__stat-label">视频库</div>
          </div>
        </div>
        <div class="wb__stat-card">
          <div class="wb__stat-icon wb__stat-icon--cyan">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          </div>
          <div class="wb__stat-body">
            <div class="wb__stat-value" id="statAnalyses">0</div>
            <div class="wb__stat-label">分析任务</div>
          </div>
        </div>
        <div class="wb__stat-card">
          <div class="wb__stat-icon wb__stat-icon--green">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          </div>
          <div class="wb__stat-body">
            <div class="wb__stat-value" id="statProjects">0</div>
            <div class="wb__stat-label">成片项目</div>
          </div>
        </div>
      </section>

      <!-- 快捷操作 -->
      <section class="wb__actions">
        <a href="/analyze" class="wb__action-btn wb__action-btn--primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          开始分析
        </a>
        <button class="wb__action-btn" id="uploadBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          上传视频
        </button>
        <input type="file" id="fileInput" accept="video/*" multiple hidden>
      </section>

      <!-- 两栏布局 -->
      <div class="wb__columns">
        <!-- 左栏：历史记录 -->
        <section class="wb__panel wb__panel--history">
          <div class="wb__panel-header">
            <h2 class="wb__panel-title">最近分析</h2>
            <div class="wb__filter">
              <button class="wb__filter-btn wb__filter-btn--active" data-mode="">全部</button>
              <button class="wb__filter-btn" data-mode="rally">得分段</button>
              <button class="wb__filter-btn" data-mode="action">动作</button>
              <button class="wb__filter-btn" data-mode="tracknet_train">模型微调</button>
              <button class="wb__filter-btn" data-mode="render">成片渲染</button>
            </div>
          </div>
          <div class="wb__panel-body" id="historyList">
            <div class="wb__empty">加载中...</div>
          </div>
        </section>

        <!-- 右栏：视频库 + 成片项目 -->
        <div class="wb__sidebar">
          <section class="wb__panel">
            <div class="wb__panel-header">
              <h2 class="wb__panel-title">视频库</h2>
              <span class="wb__count" id="videoCount">0</span>
            </div>
            <div class="wb__panel-body wb__video-grid" id="videoGrid">
              <div class="wb__empty">加载中...</div>
            </div>
          </section>

          <section class="wb__panel">
            <div class="wb__panel-header">
              <h2 class="wb__panel-title">成片项目</h2>
              <span class="wb__count" id="projectCount">0</span>
            </div>
            <div class="wb__panel-body" id="projectList">
              <div class="wb__empty">加载中...</div>
            </div>
          </section>
        </div>
      </div>

      <!-- 用户管理（仅管理员可见） -->
      <section class="wb__panel wb__admin-panel" id="adminPanel" hidden>
        <div class="wb__panel-header">
          <h2 class="wb__panel-title">用户管理</h2>
          <button class="wb__action-btn wb__action-btn--sm" id="addUserBtn">+ 创建用户</button>
        </div>
        <div class="wb__panel-body" id="userList">
          <div class="wb__empty">加载中...</div>
        </div>
      </section>

      <!-- 创建/编辑用户模态框 -->
      <div class="wb__modal" id="userModal" hidden>
        <div class="wb__modal-body wb__modal-body--form">
          <div class="wb__modal-title" id="userModalTitle">创建用户</div>
          <form id="userForm" class="wb__form">
            <input type="hidden" id="editUserId">
            <div class="wb__field">
              <label class="wb__label">用户名</label>
              <input class="wb__input" type="text" id="formUsername" required>
            </div>
            <div class="wb__field">
              <label class="wb__label">密码 <span class="wb__label-hint" id="passwordHint">(至少 8 位)</span></label>
              <input class="wb__input" type="password" id="formPassword" required>
            </div>
            <div class="wb__field">
              <label class="wb__label">角色</label>
              <select class="wb__input" id="formRole">
                <option value="analyst">分析师 (analyst)</option>
                <option value="admin">管理员 (admin)</option>
              </select>
            </div>
            <div class="wb__form-error" id="userFormError" hidden></div>
            <div class="wb__form-actions">
              <button type="button" class="wb__action-btn" id="userModalCancel">取消</button>
              <button type="submit" class="wb__action-btn wb__action-btn--primary" id="userModalSubmit">创建</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- 上传进度模态框 -->
    <div class="wb__modal" id="uploadModal" hidden>
      <div class="wb__modal-body">
        <div class="wb__modal-header">
          <span class="wb__modal-title" id="uploadModalTitle">上传中</span>
          <button class="wb__modal-cancel" id="uploadCancelBtn" type="button">取消</button>
        </div>
        <div id="uploadQueue"></div>
      </div>
    </div>

    <!-- 任务详情弹窗 -->
    <div class="wb__modal" id="taskDetailModal" hidden>
      <div class="wb__modal-body wb__modal-body--detail">
        <div class="wb__modal-header">
          <span class="wb__modal-title" id="taskDetailTitle">任务详情</span>
          <button class="wb__modal-close" onclick="closeTaskDetail()">✕</button>
        </div>
        <div id="taskDetailBody"></div>
      </div>
    </div>
  </div>
  <script src="/static/auth-check.js"></script>
  <script src="/static/workbench.js?v=6"></script>
</body>
</html>
